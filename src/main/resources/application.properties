spring.application.name=LogisticsCompany

spring.datasource.url=jdbc:mysql://localhost:3306/papa_express?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# For local development, use your own username and password
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Used to automatically create and drop tables for testing purposes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

logging.level.org.springframework.security=DEBUG
# Uncomment this line if you have initial data to load
#spring.sql.init.data-locations=classpath:db/data.sql