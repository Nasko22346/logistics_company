spring.application.name=LogisticsCompany

spring.datasource.url=jdbc:mysql://localhost:3306/papa_express?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# For local development, use your own username and password
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Used to automatically create and drop tables for testing purposes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# Uncomment this line if you have initial data to load
#spring.sql.init.data-locations=classpath:db/data.sql