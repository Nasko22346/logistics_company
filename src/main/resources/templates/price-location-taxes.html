<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Price Location Taxes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/admin-navbar :: navbar('price-location-taxes')}"></div>

<div class="container">
  <h1 class="page-title">Price Location Taxes</h1>
  <div class="muted" style="margin-bottom: 16px;">Списък с данъци/надценки по локация</div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
      <form method="get" th:action="@{/admin/price-location-taxes}" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input type="text"
               name="q"
               placeholder="Search by ID or value..."
               th:value="${q}"
               style="padding:10px; border:1px solid #ddd; border-radius:8px; min-width:260px;">
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:href="@{/admin/price-location-taxes}" class="btn btn-secondary">Clear</a>
      </form>

      <div style="display:flex; gap:10px;">
        <a class="btn btn-primary" th:href="@{/admin/price-location-taxes/new}">Add</a>
        <a class="btn btn-secondary" th:href="@{/admin}">Home</a>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="empty-message">
      Няма записи.
    </div>

    <table class="table" th:unless="${#lists.isEmpty(items)}">
      <thead>
      <tr>
        <th>ID</th>
        <th>Location Tax</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="t : ${items}">
        <td th:text="${t.id}">1</td>
        <td th:text="${t.locationTax}">10.00</td>
        <td>
          <span th:text="${t.locationLabel != null ? t.locationLabel : ('Location #' + t.locationId)}"></span>
        </td>
        <td>
          <a class="btn btn-primary" th:href="@{/admin/price-location-taxes/{id}/edit(id=${t.id})}">Edit</a>

          <form th:action="@{/admin/price-location-taxes/{id}/delete(id=${t.id})}"
                method="post"
                style="display:inline;">
            <button type="submit" class="btn btn-primary"
                    onclick="return confirm('Delete this record?')">
              Delete
            </button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
