<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/admin-navbar :: navbar('home')}"></div>

    <!-- Login Form -->
    <div class="container">
        <div class="form-container">
            <h1>Login</h1>

            <!-- Error Message -->
            <div th:if="${param.error}" class="error-alert">
                <i class="fas fa-exclamation-circle"></i>
                <span>Invalid email or password. Please try again.</span>
            </div>

            <!-- Success Message (after logout) -->
            <div th:if="${param.logout}" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>You have been logged out successfully.</span>
            </div>

            <!-- Success Message (after registration) -->
            <div th:if="${param.registered}" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>Registration successful! Please log in with your new account.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password <span style="color: red;">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <span>Don't have an account?</span>
                <a href="/register" style="color: #007bff; text-decoration: none; margin-left: 5px;">Register</a>
            </div>
        </div>
    </div>
</body>
</html>
