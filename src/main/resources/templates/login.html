<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">Papa Express</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a th:href="@{/api/v1/parcels/all}" class="nav-link">
                    <i class="fas fa-box nav-icon"></i>
                    <span class="tooltip">Parcels</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Login Form -->
    <div class="container">
        <div class="form-container">
            <h1>Login</h1>

            <!-- Error Message -->
            <div th:if="${param.error}" class="error-alert">
                <i class="fas fa-exclamation-circle"></i>
                <span>Invalid email or password. Please try again.</span>
            </div>

            <!-- Success Message (after logout) -->
            <div th:if="${param.logout}" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>You have been logged out successfully.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" name="username" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password <span style="color: red;">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
