<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Logistics Company</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            background: #333;
            padding: 15px 25px;
            color: white;
        }

        .nav-left {
            display: flex;
            gap: 20px;
        }

        .nav-btn {
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
        }

        .nav-btn:hover {
            text-decoration: underline;
        }

        .form-box {
            display: none;
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            margin: 20px;
        }

        .form-box h3 {
            text-align: center;
            margin-top: 0;
        }

        .form-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #999;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-box button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .message {
            margin: 20px;
        }

        .error { color: red; }
        .success { color: green; }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="nav-left" sec:authorize="isAnonymous()">
        <button class="nav-btn" onclick="showLogin()">Login</button>
        <button class="nav-btn" onclick="showRegister()">Register</button>
    </div>

    <div class="nav-left" sec:authorize="isAuthenticated()">
        <span>Welcome, <b sec:authentication="name"></b></span>
        <a th:href="@{/logout}" style="color:white; margin-left:20px;">Logout</a>
    </div>

</div>

<div class="message error" th:if="${param.error}">Invalid email or password</div>
<div class="message success" th:if="${param.logout}">You have been logged out</div>
<div class="message success" th:if="${param.success}">Registration successful – you may log in</div>

<div id="loginBox" class="form-box" sec:authorize="isAnonymous()">
    <h3>Login</h3>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
</div>

<div id="registerBox" class="form-box" sec:authorize="isAnonymous()">
    <h3>Register</h3>
    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
        <button type="submit">Create Account</button>
    </form>
</div>

<div class="content">
    <h1>Logistics Company Dashboard</h1>

    <div sec:authorize="isAuthenticated()">
        <p>You are logged in and can now access protected resources.</p>
    </div>

    <div sec:authorize="isAnonymous()">
        <p>Please log in or register to continue.</p>
    </div>
</div>

<script>
    const loginBox = document.getElementById("loginBox");
    const registerBox = document.getElementById("registerBox");

    function showLogin() {
        loginBox.style.display = loginBox.style.display === "block" ? "none" : "block";
        registerBox.style.display = "none";
    }

    function showRegister() {
        registerBox.style.display = registerBox.style.display === "block" ? "none" : "block";
        loginBox.style.display = "none";
    }

    document.addEventListener("click", function (e) {
        if (!e.target.closest(".nav-btn") &&
            !loginBox?.contains(e.target) &&
            !registerBox?.contains(e.target)) {
            loginBox.style.display = "none";
            registerBox.style.display = "none";
        }
    });

    if (
        window.location.search.includes("error") ||
        window.location.search.includes("logout") ||
        window.location.search.includes("success")
    ) {
        loginBox.style.display = "block";
    }
</script>

</body>
</html>
