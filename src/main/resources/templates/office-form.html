<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Office</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar">
    <a href="/admin" class="navbar-brand">Papa Express</a>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a th:href="@{/offices}" class="nav-link">
                <span class="nav-text">Offices</span>
            </a>
        </li>
    </ul>
</nav>

<div class="container">
    <div class="form-container">
        <h1 th:text="${form.id == null ? 'Create Office' : 'Edit Office'}">Office</h1>

        <form th:action="${form.id == null} ? @{/admin/offices} : @{/admin/offices/{id}(id=${form.id})}"
              th:object="${form}"
              method="post">

            <div class="form-group">
                <label for="officePhone">Phone</label>
                <input id="officePhone" type="text" th:field="*{officePhone}" required>
            </div>

            <div class="form-group">
                <label for="officeEmail">Email</label>
                <input id="officeEmail" type="email" th:field="*{officeEmail}" required>
            </div>

            <div class="form-group">
                <label for="companyId">Company</label>
                <select id="companyId" th:field="*{companyId}" required>
                    <option value="">Select company</option>
                    <option th:each="c : ${companies}"
                            th:value="${c.companyId}"
                            th:text="${c.companyName}">
                    </option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/offices}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
