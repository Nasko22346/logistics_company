<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Office</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="~{fragments/admin-navbar :: navbar('home')}"></div>

<div class="container">
    <div class="form-container">
        <h1 th:text="${form.id == null ? 'Create Office' : 'Edit Office'}">Office</h1>

        <form th:action="${form.id == null} ? @{/admin/offices} : @{/admin/offices/{id}(id=${form.id})}"
              th:object="${form}"
              method="post">

            <div th:replace="~{fragments/validation :: messages}"></div>

            <div class="form-group">
                <label for="officePhone">Phone</label>
                <input id="officePhone" type="text" th:field="*{officePhone}" required>
            </div>

            <div class="form-group">
                <label for="officeEmail">Email</label>
                <input id="officeEmail" type="email" th:field="*{officeEmail}" required>
            </div>

            <div class="form-group">
                <label for="companyId">Company</label>
                <select id="companyId" th:field="*{companyId}" required>
                    <option value="">Select company</option>
                    <option th:each="c : ${companies}"
                            th:value="${c.companyId}"
                            th:text="${c.companyName}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="openTimeId">Open Time</label>
                <select id="openTimeId" th:field="*{openTimeId}">
                    <option value="">(None)</option>
                    <option th:each="ot : ${openTimes}"
                            th:value="${ot.id}"
                    th:text="${ot.toString()}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="locationId">Location</label>
                <select id="locationId" th:field="*{locationId}">
                    <option value="">(None)</option>
                    <option th:each="l : ${locations}"
                            th:value="${l.locationId}"
                            th:text="${l.locationCountry + ' / ' + l.province + ' / ' + l.locationRegion}">
                    </option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/offices}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
