<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/admin-navbar :: navbar('home')}"></div>

    <!-- Register Form -->
    <div class="container">
        <div class="form-container">
            <h1>Register</h1>

            <!-- Error Messages -->
            <div th:if="${param.error}" class="error-alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:if="${param.error == 'password_mismatch'}">Passwords do not match. Please try again.</span>
                <span th:if="${param.error == 'register_failed'}">Registration failed. Please try again.</span>
                <span th:if="${param.error != 'password_mismatch' && param.error != 'register_failed'}">An error occurred. Please try again.</span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="email">Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password <span style="color: red;">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span style="color: red;">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <span>Already have an account?</span>
                <a href="/login-page" style="color: #007bff; text-decoration: none; margin-left: 5px;">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
