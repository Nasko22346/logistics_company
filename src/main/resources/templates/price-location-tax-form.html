<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Price Location Tax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="~{fragments/admin-navbar :: navbar('home')}"></div>

<div class="container">
  <div class="form-container">
    <h1 th:text="${form.id == null ? 'Create Price Location Tax' : 'Edit Price Location Tax'}">Form</h1>

    <form th:action="${form.id == null} ? @{/admin/price-location-taxes} : @{/admin/price-location-taxes/{id}(id=${form.id})}"
          th:object="${form}"
          method="post">

      <div class="form-group">
        <label for="locationTax">Location Tax</label>
        <input id="locationTax"
               type="number"
               step="0.01"
               min="0"
               th:field="*{locationTax}"
               required>
      </div>

      <div class="form-group">
        <label for="locationId">Location</label>
        <select id="locationId" th:field="*{locationId}" required>
          <option value="">Select location</option>
          <option th:each="l : ${locations}"
                  th:value="${l.locationId}"
          th:text="${l}">
          </option>
        </select>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/price-location-taxes}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>

  </div>
</div>

</body>
</html>
