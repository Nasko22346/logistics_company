<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Parcel - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Navigation Bar -->
<div th:replace="~{fragments/admin-navbar :: navbar('home')}"></div>

<!-- Main Content -->
<div class="container">
    <div class="form-container">
        <h1>Create New Parcel</h1>

        <!-- Global Error Message -->
        <div th:if="${error}" class="error-alert">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Parcel Creation Form -->
        <form th:action="@{/parcels/create}" th:object="${parcelRequest}" method="post">

            <!-- Weight Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('weight') ? 'has-error' : ''}">
                <label for="weight">Weight (kg) <span style="color: red;">*</span></label>
                <input type="number"
                       id="weight"
                       th:field="*{weight}"
                       placeholder="Enter weight in kilograms"
                       step="0.01"
                       min="0"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></div>
            </div>

            <!-- Hidden fields for price values -->
            <input type="hidden" id="weightTax" th:field="*{weightTax}">
            <input type="hidden" id="locationTax" th:field="*{locationTax}">
            <input type="hidden" id="calculatedPrice" th:field="*{calculatedPrice}">

            <!-- Sender Information Section -->
            <h3>Sender Information</h3>

            <!-- Sender Office Dropdown -->
            <div class="form-group" th:classappend="${#fields.hasErrors('sendLocation') ? 'has-error' : ''}">
                <label for="sendLocation">Sender Office <span style="color: red;">*</span></label>
                <select id="sendLocation"
                        th:field="*{sendLocation}"
                        required>
                    <option value="">-- Select Office --</option>
                    <option th:each="location : ${parcelResponseWithDefaults.sendLocation()}"
                            th:value="${location}"
                            th:text="${location}">
                    </option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('sendLocation')}" th:errors="*{sendLocation}"></div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('senderFirstName') ? 'has-error' : ''}">
                <label for="senderFirstName">First Name <span style="color: red;">*</span></label>
                <input type="text"
                       id="senderFirstName"
                       th:field="*{senderFirstName}"
                       placeholder="Enter sender's first name"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('senderFirstName')}" th:errors="*{senderFirstName}"></div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('senderLastName') ? 'has-error' : ''}">
                <label for="senderLastName">Last Name <span style="color: red;">*</span></label>
                <input type="text"
                       id="senderLastName"
                       th:field="*{senderLastName}"
                       placeholder="Enter sender's last name"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('senderLastName')}" th:errors="*{senderLastName}"></div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('senderPhone') ? 'has-error' : ''}">
                <label for="senderPhone">Phone <span style="color: red;">*</span></label>
                <input type="text"
                       id="senderPhone"
                       th:field="*{senderPhone}"
                       placeholder="Enter sender's phone number"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('senderPhone')}" th:errors="*{senderPhone}"></div>
            </div>

            <!-- Recipient Information Section -->
            <h3>Recipient Information</h3>

            <!-- Receiver Location Type Toggle -->
            <div class="form-group">
                <label>
                    <input type="checkbox" id="deliverToOffice" onchange="toggleReceiverLocation()">
                    Deliver to Office
                </label>
            </div>

            <!-- Receiver Office Dropdown (shown when checkbox is checked) -->
            <div id="officeDeliverySection" class="form-group" style="display: none;" th:classappend="${#fields.hasErrors('receiverLocation') ? 'has-error' : ''}">
                <label for="receiverLocation">Receiver Office <span style="color: red;">*</span></label>
                <select id="receiverLocation"
                        th:field="*{receiverLocation}">
                    <option value="">-- Select Office --</option>
                    <option th:each="location : ${parcelResponseWithDefaults.receiverLocation()}"
                            th:value="${location}"
                            th:text="${location}">
                    </option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('receiverLocation')}" th:errors="*{receiverLocation}"></div>
            </div>

            <!-- Address Delivery Fields (shown when checkbox is unchecked) -->
            <div id="addressDeliverySection">
                <div class="form-group" th:classappend="${#fields.hasErrors('locationCountry') ? 'has-error' : ''}">
                    <label for="locationCountry">Country <span style="color: red;">*</span></label>
                    <input type="text"
                           id="locationCountry"
                           th:field="*{locationCountry}"
                           placeholder="Enter country">
                    <div class="error-message" th:if="${#fields.hasErrors('locationCountry')}" th:errors="*{locationCountry}"></div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('province') ? 'has-error' : ''}">
                    <label for="province">Province <span style="color: red;">*</span></label>
                    <input type="text"
                           id="province"
                           th:field="*{province}"
                           placeholder="Enter province">
                    <div class="error-message" th:if="${#fields.hasErrors('province')}" th:errors="*{province}"></div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('locationRegion') ? 'has-error' : ''}">
                    <label for="locationRegion">Region/City <span style="color: red;">*</span></label>
                    <input type="text"
                           id="locationRegion"
                           th:field="*{locationRegion}"
                           placeholder="Enter region or city">
                    <div class="error-message" th:if="${#fields.hasErrors('locationRegion')}" th:errors="*{locationRegion}"></div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('locationDescription') ? 'has-error' : ''}">
                    <label for="locationDescription">Address Description <span style="color: red;">*</span></label>
                    <textarea id="locationDescription"
                              th:field="*{locationDescription}"
                              rows="3"
                              placeholder="Enter detailed address (street, building, apartment, etc.)"></textarea>
                    <div class="error-message" th:if="${#fields.hasErrors('locationDescription')}" th:errors="*{locationDescription}"></div>
                </div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('recipientFirstName') ? 'has-error' : ''}">
                <label for="recipientFirstName">First Name <span style="color: red;">*</span></label>
                <input type="text"
                       id="recipientFirstName"
                       th:field="*{recipientFirstName}"
                       placeholder="Enter recipient's first name"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('recipientFirstName')}" th:errors="*{recipientFirstName}"></div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('recipientLastName') ? 'has-error' : ''}">
                <label for="recipientLastName">Last Name <span style="color: red;">*</span></label>
                <input type="text"
                       id="recipientLastName"
                       th:field="*{recipientLastName}"
                       placeholder="Enter recipient's last name"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('recipientLastName')}" th:errors="*{recipientLastName}"></div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('recipientPhone') ? 'has-error' : ''}">
                <label for="recipientPhone">Phone <span style="color: red;">*</span></label>
                <input type="text"
                       id="recipientPhone"
                       th:field="*{recipientPhone}"
                       placeholder="Enter recipient's phone number"
                       required>
                <div class="error-message" th:if="${#fields.hasErrors('recipientPhone')}" th:errors="*{recipientPhone}"></div>
            </div>

<!--            &lt;!&ndash; Staff dropdown &ndash;&gt;-->
<!--            <div class="form-group" th:classappend="${#fields.hasErrors('staffName') ? 'has-error' : ''}">-->
<!--                <label for="staffName">Staff <span style="color: red;">*</span></label>-->
<!--                <select id="staffName"-->
<!--                        th:field="*{staffName}"-->
<!--                        required>-->
<!--                    <option value="">&#45;&#45; Select Staff &#45;&#45;</option>-->
<!--                    <option th:each="name : ${parcelResponseWithDefaults.staffName()}"-->
<!--                            th:value="${name}"-->
<!--                            th:text="${name}">-->
<!--                    </option>-->
<!--                </select>-->
<!--                <div class="error-message" th:if="${#fields.hasErrors('staffName')}" th:errors="*{staffName}"></div>-->
<!--            </div>-->

            <!-- Price Calculation Section -->
            <div class="form-group" style="margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6;">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-calculator"></i> Price Estimate</h3>
                <div id="priceBreakdown">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Weight Tax:</span>
                        <span id="weightTaxDisplay">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Location Tax (<span id="deliveryTypeDisplay">Address</span>):</span>
                        <span id="locationTaxDisplay">--</span>
                    </div>
                    <hr style="margin: 10px 0;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em;">
                        <span>Total Price:</span>
                        <span id="totalPriceDisplay">--</span>
                    </div>
                </div>
                <p id="priceMessage" style="color: #6c757d; font-size: 0.9em; margin-top: 10px;">
                    Enter weight to see price estimate.
                </p>
            </div>

            <!-- Form Buttons -->
            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Create Parcel
                </button>
                <a href="/admin" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
<script>
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    function toggleReceiverLocation() {
        const checkbox = document.getElementById('deliverToOffice');
        const officeSection = document.getElementById('officeDeliverySection');
        const addressSection = document.getElementById('addressDeliverySection');
        const receiverLocationSelect = document.getElementById('receiverLocation');
        const addressFields = addressSection.querySelectorAll('input, textarea');

        if (checkbox.checked) {
            officeSection.style.display = 'block';
            addressSection.style.display = 'none';
            receiverLocationSelect.required = true;
            addressFields.forEach(function(field) {
                field.required = false;
            });
        } else {
            officeSection.style.display = 'none';
            addressSection.style.display = 'block';
            receiverLocationSelect.required = false;
            addressFields.forEach(function(field) {
                field.required = true;
            });
        }

        // Recalculate price when delivery type changes
        calculatePrice();
    }

    async function calculatePrice() {
        const weightInput = document.getElementById('weight');
        const deliverToOffice = document.getElementById('deliverToOffice');

        const weight = parseFloat(weightInput.value);
        const deliveryType = deliverToOffice.checked ? 'office' : 'address';

        // Update delivery type display
        document.getElementById('deliveryTypeDisplay').textContent =
            deliverToOffice.checked ? 'Office' : 'Address';

        // If no valid weight, show placeholder
        if (!weight || weight <= 0) {
            document.getElementById('weightTaxDisplay').textContent = '--';
            document.getElementById('locationTaxDisplay').textContent = '--';
            document.getElementById('totalPriceDisplay').textContent = '--';
            document.getElementById('priceMessage').textContent = 'Enter weight to see price estimate.';
            return;
        }

        try {
            const response = await fetch(`/parcels/calculate-price?weight=${weight}&deliveryType=${deliveryType}`);

            if (!response.ok) {
                throw new Error('Failed to calculate price');
            }

            const data = await response.json();

            // Update display (format with 2 decimal places and BGN currency)
            document.getElementById('weightTaxDisplay').textContent = data.weightTax.toFixed(2) + ' BGN';
            document.getElementById('locationTaxDisplay').textContent = data.locationTax.toFixed(2) + ' BGN';
            document.getElementById('totalPriceDisplay').textContent = data.totalPrice.toFixed(2) + ' BGN';
            document.getElementById('priceMessage').textContent = 'Price calculated based on weight and delivery type.';

            // Update hidden form fields
            document.getElementById('weightTax').value = data.weightTax;
            document.getElementById('locationTax').value = data.locationTax;
            document.getElementById('calculatedPrice').value = data.totalPrice;

        } catch (error) {
            console.error('Error calculating price:', error);
            document.getElementById('priceMessage').textContent = 'Unable to calculate price. Please try again.';
        }
    }

    const debouncedCalculatePrice = debounce(calculatePrice, 300);

    document.addEventListener('DOMContentLoaded', function() {
        toggleReceiverLocation();

        // Add event listener for weight changes
        const weightInput = document.getElementById('weight');
        weightInput.addEventListener('input', debouncedCalculatePrice);
        weightInput.addEventListener('change', calculatePrice);

        // Add event listener for delivery type checkbox
        const deliverToOffice = document.getElementById('deliverToOffice');
        deliverToOffice.addEventListener('change', function() {
            toggleReceiverLocation();
        });

        // Initial calculation if weight is pre-filled
        if (weightInput.value) {
            calculatePrice();
        }
    });
</script>
</body>
</html>
