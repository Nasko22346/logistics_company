<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Parcel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div th:replace="fragments/admin-navbar :: navbar('parcel-admin')"></div>

<div class="container">
  <div class="form-container">
    <h1 th:text="${form.id == null ? 'Create Parcel' : 'Edit Parcel'}">Parcel</h1>

    <form th:action="${form.id == null} ? @{/admin/parcels} : @{/admin/parcels/{id}(id=${form.id})}"
          th:object="${form}"
          method="post">

      <div th:replace="fragments/validation :: validation"></div>

      <!-- ============== DISABLED FIELDS (Read-only) ============== -->

      <!-- Tracking Number - auto-generated, not editable -->
      <div class="form-group" th:if="${form.id != null}">
        <label>Tracking Number</label>
        <input type="text" th:value="*{trackingNumber}" disabled>
        <input type="hidden" name="trackingNumber" th:value="*{trackingNumber}">
        <div class="muted">Tracking number is auto-generated and cannot be edited.</div>
      </div>

      <!-- Weight - set at creation, not editable -->
      <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" step="0.01" th:value="*{weight}" disabled>
        <input type="hidden" name="weight" th:value="*{weight}">
      </div>

      <!-- Sender Information - not editable -->
      <div class="form-group">
        <label>Sender First Name</label>
        <input type="text" th:value="*{senderFirstName}" disabled>
        <input type="hidden" name="senderFirstName" th:value="*{senderFirstName}">
      </div>

      <div class="form-group">
        <label>Sender Last Name</label>
        <input type="text" th:value="*{senderLastName}" disabled>
        <input type="hidden" name="senderLastName" th:value="*{senderLastName}">
      </div>

      <div class="form-group">
        <label>Sender Phone</label>
        <input type="text" th:value="*{senderPhone}" disabled>
        <input type="hidden" name="senderPhone" th:value="*{senderPhone}">
      </div>

      <!-- Sent Date - set at creation, not editable -->
      <div class="form-group">
        <label for="sentDate">Sent Date</label>
        <input id="sentDate" type="datetime-local" th:value="*{sentDate}" disabled>
        <input type="hidden" name="sentDate" th:value="*{sentDate}">
      </div>

      <!-- ============== EDITABLE FIELDS ============== -->

      <!-- Price - admin can adjust -->
      <div class="form-group">
        <label for="calculatedPrice">Price</label>
        <input id="calculatedPrice" type="number" step="0.01" name="calculatedPrice" th:value="*{price}">
      </div>

      <!-- Received Date - set when delivered -->
      <div class="form-group">
        <label for="receivedDate">Received Date</label>
        <input id="receivedDate" type="datetime-local" name="receivedDate" th:value="*{receivedDate}">
      </div>

      <!-- Status - dropdown with ParcelStatus values -->
      <div class="form-group">
        <label for="parcelStatus">Status</label>
        <select id="parcelStatus" name="parcelStatus">
          <option value="">Select status</option>
          <option th:each="s : ${statuses}"
                  th:value="${s}"
                  th:text="${s}"
                  th:selected="${s.name() == form.parcelStatus}"></option>
        </select>
      </div>

      <!-- Recipient Information - editable -->
      <div class="form-group">
        <label for="recipientFirstName">Recipient First Name</label>
        <input id="recipientFirstName" type="text" name="recipientFirstName" th:value="*{recipientFirstName}">
      </div>

      <div class="form-group">
        <label for="recipientLastName">Recipient Last Name</label>
        <input id="recipientLastName" type="text" name="recipientLastName" th:value="*{recipientLastName}">
      </div>

      <div class="form-group">
        <label for="recipientPhone">Recipient Phone</label>
        <input id="recipientPhone" type="text" name="recipientPhone" th:value="*{recipientPhone}">
      </div>

      <!-- Staff - dropdown selection -->
      <div class="form-group">
        <label for="staffName">Staff</label>
        <select id="staffName" name="staffName">
          <option value="">(none)</option>
          <option th:each="s : ${staffList}"
                  th:value="${s.staffUserDetails.firstName + ' ' + s.staffUserDetails.lastName}"
                  th:text="${s.staffUserDetails.firstName + ' ' + s.staffUserDetails.lastName}"
                  th:selected="${form.staffName != null and form.staffName.contains(s.staffUserDetails.firstName + ' ' + s.staffUserDetails.lastName)}"></option>
        </select>
      </div>

      <!-- Address Delivery Location Fields - editable -->
      <div class="form-group">
        <label for="locationCountry">Delivery Country</label>
        <input id="locationCountry" type="text" name="locationCountry" th:value="*{locationCountry}">
      </div>

      <div class="form-group">
        <label for="province">Delivery Province</label>
        <input id="province" type="text" name="province" th:value="*{province}">
      </div>

      <div class="form-group">
        <label for="locationRegion">Delivery Region</label>
        <input id="locationRegion" type="text" name="locationRegion" th:value="*{locationRegion}">
      </div>

      <div class="form-group">
        <label for="locationDescription">Delivery Address Description</label>
        <input id="locationDescription" type="text" name="locationDescription" th:value="*{locationDescription}">
      </div>

      <div class="form-buttons">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/admin/parcels}">Cancel</a>
      </div>
    </form>

  </div>
</div>

</body>
</html>
