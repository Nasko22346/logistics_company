<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Parcel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div th:replace="fragments/admin-navbar :: navbar('parcel-admin')"></div>

<div class="container">
  <div class="form-container">
    <h1 th:text="${form.id == null ? 'Create Parcel' : 'Edit Parcel'}">Parcel</h1>

    <form th:action="${form.id == null} ? @{/admin/parcels} : @{/admin/parcels/{id}(id=${form.id})}"
          th:object="${form}"
          method="post">

      <!-- ВАЖНО: validation fragment трябва да е ВЪТРЕ в form/th:object контекст -->
      <div th:replace="fragments/validation :: validation"></div>

      <div class="form-group" th:if="${form.id != null}">
        <label>Tracking Number</label>
        <input type="text" th:field="*{trackingNumber}" disabled>
        <div class="muted">Tracking номерът се генерира автоматично и не се редактира.</div>
      </div>

      <div class="form-group">
        <label for="weight">Weight</label>
        <input id="weight" type="number" step="0.01" th:field="*{weight}">
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input id="price" type="number" step="0.01" th:field="*{price}">
      </div>

      <div class="form-group">
        <label for="sentDate">Sent Date</label>
        <input id="sentDate" type="datetime-local" th:field="*{sentDate}">
      </div>

      <div class="form-group">
        <label for="receivedDate">Received Date</label>
        <input id="receivedDate" type="datetime-local" th:field="*{receivedDate}">
      </div>

      <div class="form-group">
        <label for="parcelStatus">Status</label>
        <select id="parcelStatus" th:field="*{parcelStatus}">
          <option value="">Select status</option>
          <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="sendLocationId">Send Location</label>
        <select id="sendLocationId" th:field="*{sendLocationId}">
          <option value="">(empty)</option>
          <option th:each="l : ${locations}"
                  th:value="${l.locationId}"
                  th:text="${l.locationCountry + ', ' + l.locationRegion + ' (' + l.province + ')'}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="receiverLocationId">Receiver Location</label>
        <select id="receiverLocationId" th:field="*{receiverLocationId}">
          <option value="">(empty)</option>
          <option th:each="l : ${locations}"
                  th:value="${l.locationId}"
                  th:text="${l.locationCountry + ', ' + l.locationRegion + ' (' + l.province + ')'}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="senderUserId">Sender User</label>
        <select id="senderUserId" th:field="*{senderUserId}">
          <option value="">(empty)</option>
          <option th:each="u : ${users}"
                  th:value="${u.id}"
                  th:text="${'User #' + u.id}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="receiverUserId">Receiver User</label>
        <select id="receiverUserId" th:field="*{receiverUserId}">
          <option value="">(empty)</option>
          <option th:each="u : ${users}"
                  th:value="${u.id}"
                  th:text="${'User #' + u.id}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="priceLocationTaxId">Price Location Tax</label>
        <select id="priceLocationTaxId" th:field="*{priceLocationTaxId}">
          <option value="">(empty)</option>
          <option th:each="t : ${locationTaxes}"
                  th:value="${t.id}"
                  th:text="${t.locationTax}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="priceWeightTaxId">Price Weight Tax</label>
        <select id="priceWeightTaxId" th:field="*{priceWeightTaxId}">
          <option value="">(empty)</option>
          <option th:each="t : ${weightTaxes}"
                  th:value="${t.id}"
                  th:text="${t.weightTax + ' (<= ' + t.maxWeightAmount + ')'}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="staffId">Staff</label>
        <select id="staffId" th:field="*{staffId}">
          <option value="">(empty)</option>
          <option th:each="s : ${staffList}"
                  th:value="${s.staffId}"
                  th:text="${'Staff #' + s.staffId + ' (' + s.position + ')'}"></option>
        </select>
      </div>

      <div class="form-buttons">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/admin/parcels}">Cancel</a>
      </div>
    </form>

  </div>
</div>

</body>
</html>
