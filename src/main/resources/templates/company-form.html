<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company</title>

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar">
  <a href="/admin" class="navbar-brand">Papa Express</a>
  <ul class="navbar-nav">
    <li class="nav-item">
      <a th:href="@{/admin/companies}" class="nav-link">
        <span class="nav-text">Companies</span>
      </a>
    </li>
  </ul>
</nav>

<div class="container">
  <div class="form-container">
    <h1 th:text="${form.id == null ? 'Create Company' : 'Edit Company'}">Company</h1>

    <form th:action="${form.id == null} ? @{/admin/companies} : @{/admin/companies/{id}(id=${form.id})}"
          th:object="${form}"
          method="post">

      <div class="form-group">
        <label for="companyName">Name</label>
        <input id="companyName" type="text" th:field="*{companyName}" required>
      </div>

      <div class="form-group">
        <label for="companyEik">EIK</label>
        <input id="companyEik" type="text" th:field="*{companyEik}" required>
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone</label>
        <input id="phoneNumber" type="text" th:field="*{phoneNumber}">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
      </div>

      <div class="form-group">
        <label for="companyDescription">Description</label>
        <input id="companyDescription" type="text" th:field="*{companyDescription}">
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/companies}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
