<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">Papa Express</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a th:href="@{/api/v1/parcels/all}" class="nav-link">
                    <i class="fas fa-box nav-icon"></i>
                    <span class="tooltip">Parcels</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/api/v1/parcels/create}" class="nav-link">
                    <i class="fas fa-plus-circle nav-icon"></i>
                    <span class="tooltip">Create Parcel</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="welcome-section">
            <h1>Welcome to Papa Express</h1>
            <p>Leading logistics company in Bulgaria</p>
            <p>Use the navigation bar above to manage parcels, companies, and offices.</p>
        </div>
    </div>
</body>
</html>
