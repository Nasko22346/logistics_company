<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar" th:fragment="navbar(active)">
  <a href="/admin" class="navbar-brand">Papa Express</a>

  <ul class="navbar-nav">

    <li class="nav-item">
      <a th:href="@{/admin}" class="nav-link" th:classappend="${active == 'home'} ? ' active' : ''">
        <i class="fas fa-house nav-icon"></i>
        <span class="tooltip">Home</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/admin/companies}" class="nav-link" th:classappend="${active == 'companies'} ? ' active' : ''">
        <i class="fas fa-building nav-icon"></i>
        <span class="tooltip">Companies</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/admin/offices}" class="nav-link" th:classappend="${active == 'offices'} ? ' active' : ''">
        <i class="fas fa-city nav-icon"></i>
        <span class="tooltip">Offices</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/admin/locations}" class="nav-link" th:classappend="${active == 'locations'} ? ' active' : ''">
        <i class="fas fa-map-location-dot nav-icon"></i>
        <span class="tooltip">Locations</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/admin/price-location-taxes}" class="nav-link" th:classappend="${active == 'price-location-taxes'} ? ' active' : ''">
        <i class="fas fa-money-bill-wave nav-icon"></i>
        <span class="tooltip">PriceLocationTax</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/admin/price-weight-taxes}" class="nav-link" th:classappend="${active == 'price-weight-taxes'} ? ' active' : ''">
        <i class="fas fa-money-bill-wave nav-icon"></i>
        <span class="tooltip">PriceWeightTax</span>
      </a>
    </li>

    <li class="nav-item">
      <a th:href="@{/api/v1/parcels/all}" class="nav-link">
        <i class="fas fa-box nav-icon"></i>
        <span class="tooltip">Parcels</span>
      </a>
    </li>
<!--    TODO: Move create parcel to not be part of the navbar but instead to be a button in the parcels/all-->
    <li class="nav-item">
      <a th:href="@{/api/v1/parcels/create}" class="nav-link">
        <i class="fas fa-plus-circle nav-icon"></i>
        <span class="tooltip">Create Parcel</span>
      </a>
    </li>

  </ul>
</nav>
</body>
</html>
