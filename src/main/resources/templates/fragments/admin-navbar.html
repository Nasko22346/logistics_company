<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar" th:fragment="navbar(active)">
    <a href="/admin" class="navbar-brand">Papa Express</a>
    <div>
        <ul sec:authorize="isAuthenticated()" class="navbar-nav">
            <li class="nav-item">
                <a th:href="@{/admin}" class="nav-link" th:classappend="${active == 'home'} ? ' active' : ''">
                    <i class="fas fa-house nav-icon"></i>
                    <span class="tooltip">Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/companies}" class="nav-link"
                   th:classappend="${active == 'companies'} ? ' active' : ''">
                    <i class="fas fa-building nav-icon"></i>
                    <span class="tooltip">Companies</span>
                </a>
            </li>

            <li class="nav-item">
                <a th:href="@{/admin/offices}" class="nav-link" th:classappend="${active == 'offices'} ? ' active' : ''">
                    <i class="fas fa-city nav-icon"></i>
                    <span class="tooltip">Offices</span>
                </a>
            </li>

            <li class="nav-item">
                <a th:href="@{/admin/locations}" class="nav-link"
                   th:classappend="${active == 'locations'} ? ' active' : ''">
                    <i class="fas fa-map-location-dot nav-icon"></i>
                    <span class="tooltip">Locations</span>
                </a>
            </li>

            <li class="nav-item">
                <a th:href="@{/admin/price-location-taxes}" class="nav-link"
                   th:classappend="${active == 'plt'} ? ' active' : ''">
                    <i class="fas fa-money-bill-wave nav-icon"></i>
                    <span class="tooltip">PriceLocationTax</span>
                </a>
            </li>
        </ul>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a th:href="@{/login-page}" class="nav-link">
                    <i class="fa fa-sign-in" aria-hidden="true"></i>
                    <span class="tooltip">Login</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/parcels/get-create-form}" class="nav-link">
                    <i class="fas fa-plus-circle nav-icon"></i>
                    <span class="tooltip">Create Parcel</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/track-parcel}" class="nav-link">
                    <i class="fas fa-plus-circle nav-icon"></i>
                    <span class="tooltip">Track Parcel</span>
                </a>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
