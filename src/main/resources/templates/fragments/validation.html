<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="validation">
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" style="margin-bottom:12px;">
        <ul style="margin:0; padding-left:18px;">
            <li th:each="e : ${#fields.errors('*')}" th:text="${e}"></li>
            <li th:each="e : ${#fields.globalErrors()}" th:text="${e}"></li>
        </ul>
    </div>
</div>
</body>
</html>
