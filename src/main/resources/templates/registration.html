<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">Papa Express</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a th:href="@{/api/v1/parcels/all}" class="nav-link">
                    <i class="fas fa-box nav-icon"></i>
                    <span class="tooltip">Parcels</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Registration Form -->
    <div class="container">
        <div class="form-container">
            <h1>Create Account</h1>

            <!-- Error Message -->
            <div th:if="${error}" class="error-alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Registration failed. Please try again.</span>
            </div>

            <!-- Success Message -->
            <div th:if="${success}" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}">Registration successful!</span>
            </div>

            <form th:action="@{/api/v1/auth/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label for="firstName">First Name <span style="color: red;">*</span></label>
                    <input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter your first name" required>
                    <span th:if="${#fields.hasErrors('firstName')}" class="error-message" th:errors="*{firstName}"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span style="color: red;">*</span></label>
                    <input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter your last name" required>
                    <span th:if="${#fields.hasErrors('lastName')}" class="error-message" th:errors="*{lastName}"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Enter your email" required>
                    <span th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password <span style="color: red;">*</span></label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Enter your password" required>
                    <span th:if="${#fields.hasErrors('password')}" class="error-message" th:errors="*{password}"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span style="color: red;">*</span></label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Confirm your password" required>
                    <span th:if="${#fields.hasErrors('confirmPassword')}" class="error-message" th:errors="*{confirmPassword}"></span>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                    <a th:href="@{/api/v1/auth/login}" class="btn btn-secondary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                </div>
            </form>

            <p style="text-align: center; margin-top: 20px; color: #666;">
                Already have an account? <a th:href="@{/api/v1/auth/login}" style="color: #4CAF50;">Sign in here</a>
            </p>
        </div>
    </div>
</body>
</html>
