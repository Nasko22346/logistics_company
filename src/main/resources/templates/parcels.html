<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Parcels - Papa Express</title>
    <link rel="stylesheet" th:href="@{/css/parcels.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <a href="/" class="navbar-brand">Papa Express</a>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a th:href="@{/api/v1/parcels/create}" class="nav-link">
                <i class="fas fa-plus-circle nav-icon"></i>
                <span class="tooltip">Create Parcel</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/login}" class="nav-link" title="Login">
                <i class="fas fa-user nav-icon"></i>
            </a>
        </li>
    </ul>
</nav>
    <h1>All Parcels</h1>

    <!-- Filter Toolbar -->
    <div class="filter-toolbar">
        <span class="filter-label">Filter by:</span>
        <a th:href="@{/api/v1/parcels/all}" class="filter-btn" th:classappend="${filterType == null ? 'active' : ''}">
            <i class="fas fa-list"></i> All Registered
        </a>
        <form th:action="@{/api/v1/parcels/by-employee}" method="get" class="filter-form">
            <input type="number" name="employeeId" placeholder="Employee ID" required min="1"/>
            <button type="submit" th:classappend="${filterType == 'by-employee' ? 'active' : ''}">
                <i class="fas fa-user-tie"></i> By Employee
            </button>
        </form>
        <a th:href="@{/api/v1/parcels/not-received}" class="filter-btn" th:classappend="${filterType == 'not-received' ? 'active' : ''}">
            <i class="fas fa-clock"></i> Not Received
        </a>
        <form th:action="@{/api/v1/parcels/by-sender}" method="get" class="filter-form">
            <input type="number" name="senderId" placeholder="Sender ID" required min="1"/>
            <button type="submit" th:classappend="${filterType == 'by-sender' ? 'active' : ''}">
                <i class="fas fa-paper-plane"></i> By Sender
            </button>
        </form>
        <form th:action="@{/api/v1/parcels/by-receiver}" method="get" class="filter-form">
            <input type="number" name="receiverId" placeholder="Receiver ID" required min="1"/>
            <button type="submit" th:classappend="${filterType == 'by-receiver' ? 'active' : ''}">
                <i class="fas fa-inbox"></i> By Receiver
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(parcels)}" class="empty-message">
        <p>No parcels found in the system.</p>
    </div>

    <table th:unless="${#lists.isEmpty(parcels)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Weight (kg)</th>
                <th>Price (BGN)</th>
                <th>Status</th>
                <th>Sent Date</th>
                <th>Received Date</th>
                <th>Sender</th>
                <th>Receiver</th>
                <th>Registered By</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="parcel : ${parcels}"
                th:onclick="'window.location.href=\'/api/v1/parcels/' + ${parcel.id} + '\''"
                class="clickable-row">
                <td th:text="${parcel.id}">1</td>
                <td th:text="${#numbers.formatDecimal(parcel.weight, 1, 2)}">1.50</td>
                <td th:text="${#numbers.formatDecimal(parcel.price, 1, 2)}">15.00</td>
                <td>
                    <span th:text="${parcel.status}"
                          th:class="'status-badge status-' + ${parcel.status}"
                          class="status-badge">PENDING</span>
                </td>
                <td th:text="${parcel.sentDate != null ? #temporals.format(parcel.sentDate, 'dd/MM/yyyy') : 'N/A'}">15/01/2024</td>
                <td th:text="${parcel.receivedDate != null ? #temporals.format(parcel.receivedDate, 'dd/MM/yyyy') : 'N/A'}">16/01/2024</td>
                <td th:text="${parcel.senderName ?: 'Unknown'}">John Doe</td>
                <td th:text="${parcel.receiverName ?: 'Unknown'}">Jane Smith</td>
                <td th:text="${parcel.registeredByStaffName ?: 'N/A'}">Staff Member</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
