<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Parcels - Papa Express</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/parcels.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <a href="/admin" class="navbar-brand">Papa Express</a>

    <ul class="navbar-nav">
        <li class="nav-item">
            <a th:href="@{/api/v1/parcels/create}" class="nav-link">
                <i class="fas fa-plus-circle nav-icon"></i>
                <span class="tooltip">Create Parcel</span>
            </a>
        </li>
    </ul>
</nav>

<div class="container">
    <h1 class="page-title">All Parcels</h1>

    <div th:if="${#lists.isEmpty(parcels)}" class="empty-message">
        <p>No parcels found in the system.</p>
    </div>

    <table class="table" th:unless="${#lists.isEmpty(parcels)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Weight (kg)</th>
            <th>Price (BGN)</th>
            <th>Status</th>
            <th>Sent Date</th>
            <th>Received Date</th>
            <th>Sender</th>
            <th>Receiver</th>
            <th>Registered By</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="parcel : ${parcels}">
            <td data-label="ID" th:text="${parcel.id}">1</td>

            <td data-label="Weight (kg)"
                th:text="${#numbers.formatDecimal(parcel.weight, 1, 2)}">1.50</td>

            <td data-label="Price (BGN)"
                th:text="${#numbers.formatDecimal(parcel.price, 1, 2)}">15.00</td>

            <td data-label="Status">
                <span th:text="${parcel.status}"
                      th:class="'status-badge status-' + ${parcel.status}"
                      class="status-badge">PENDING</span>
            </td>

            <td data-label="Sent Date"
                th:text="${parcel.sentDate != null ? #temporals.format(parcel.sentDate, 'dd/MM/yyyy') : 'N/A'}">
                15/01/2024
            </td>

            <td data-label="Received Date"
                th:text="${parcel.receivedDate != null ? #temporals.format(parcel.receivedDate, 'dd/MM/yyyy') : 'N/A'}">
                16/01/2024
            </td>

            <td data-label="Sender" th:text="${parcel.senderName ?: 'Unknown'}">John Doe</td>
            <td data-label="Receiver" th:text="${parcel.receiverName ?: 'Unknown'}">Jane Smith</td>
            <td data-label="Registered By" th:text="${parcel.registeredByStaffName ?: 'N/A'}">Staff Member</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
