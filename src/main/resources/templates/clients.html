<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Clients</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/admin-navbar :: navbar('clients')}"></div>

<div class="container">
  <h1>Clients</h1>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div style="display:flex; gap:12px; align-items:center; margin:12px 0;">
    <a class="btn btn-primary" th:href="@{/admin/clients/new}">+ New Client</a>

    <form th:action="@{/admin/clients}" method="get" style="display:flex; gap:8px;">
      <input type="text" name="q" placeholder="Search name / phone / email" th:value="${q}">
      <button type="submit" class="btn">Search</button>
    </form>
  </div>

  <table class="table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Full name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clients}">
      <td th:text="${c.id}">1</td>
      <td th:text="${#strings.trim(
        (c.firstName ?: '') + ' ' + (c.middleName ?: '') + ' ' + (c.lastName ?: '')
      )}">John Doe</td>
      <td th:text="${c.phoneNumber ?: '-'}">-</td>
      <td th:text="${c.loginDetails != null ? c.loginDetails.email : '-'}">-</td>
      <td th:text="${c.loginDetails != null ? c.loginDetails.role : '-'}">-</td>
      <td>
        <a class="btn btn-primary" th:href="@{/admin/clients/{id}/edit(id=${c.id})}">Edit</a>
        <form th:action="@{/admin/clients/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
          <button class="btn btn-danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
